on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  run_pull:
    name: run pull
    runs-on: self-hosted
    
    steps:
    - name: Debug
      run: |
        echo "USER set? ${{ secrets.SSH_USER != '' }}"
        echo "HOST set? ${{ secrets.SSH_HOST != '' }}"
        echo "WORK_DIR set? ${{ secrets.WORK_DIR != '' }}"
    - name: Pull latest code
      run: |
        cd "${{ secrets.WORK_DIR }}"
        git status
        git pull 
    - name: cleanup
      run: rm -rf ~/.ssh
